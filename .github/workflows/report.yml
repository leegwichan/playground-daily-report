name: Daily / Weekly / Monthly Report

on:
  schedule:
    # 매일 KST 08:00 (= UTC 23:00)
    - cron: '0 23 * * *'
    # 매주 월요일 KST 08:00 (= UTC 일요일 23:00)
    - cron: '0 23 * * 0'
    # 매월 1일 KST 08:00 (= UTC 마지막날 23:00). 28-31 모두 트리거하되
    # "내일이 1일" 인 경우에만 실행 (실제 월말만 통과시키는 가드).
    - cron: '0 23 28-31 * *'

  workflow_dispatch:
    inputs:
      kind:
        description: '발송할 리포트 종류'
        type: choice
        options:
          - daily
          - weekly
          - monthly
        default: daily

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # state.db 자동 commit 을 위해 필요
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Determine report kind
        id: kind
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          schedule="${{ github.event.schedule }}"

          if [ "$event" = "workflow_dispatch" ]; then
            echo "kind=${{ github.event.inputs.kind }}" >> "$GITHUB_OUTPUT"
            echo "→ manual: ${{ github.event.inputs.kind }}"
          elif [ "$schedule" = "0 23 28-31 * *" ]; then
            # 내일이 1일인 경우만 monthly. 그 외는 skip.
            next_day=$(date -u -d 'tomorrow' +%d)
            if [ "$next_day" = "01" ]; then
              echo "kind=monthly" >> "$GITHUB_OUTPUT"
              echo "→ monthly (내일이 1일)"
            else
              echo "kind=skip" >> "$GITHUB_OUTPUT"
              echo "→ skip (내일은 ${next_day}일, 월말 아님)"
            fi
          elif [ "$schedule" = "0 23 * * 0" ]; then
            echo "kind=weekly" >> "$GITHUB_OUTPUT"
            echo "→ weekly (일요일 트리거)"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"
            echo "→ daily"
          fi

      - name: Run report
        if: steps.kind.outputs.kind != 'skip'
        env:
          GOOGLE_API_KEY:          ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_DAILY:   ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          DISCORD_WEBHOOK_WEEKLY:  ${{ secrets.DISCORD_WEBHOOK_WEEKLY }}
          DISCORD_WEBHOOK_MONTHLY: ${{ secrets.DISCORD_WEBHOOK_MONTHLY }}
          DISCORD_WEBHOOK_CS:      ${{ secrets.DISCORD_WEBHOOK_CS }}
          NOTION_API_TOKEN:        ${{ secrets.NOTION_API_TOKEN }}
          GITHUB_TOKEN_USER:       ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GIT_AUTHOR_EMAIL:        ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: python -m daily_report.main --kind ${{ steps.kind.outputs.kind }}

      - name: Commit state.db
        if: steps.kind.outputs.kind != 'skip'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: state.db update (${{ steps.kind.outputs.kind }}) [skip ci]'
          file_pattern: data/state.db
          commit_user_name: 'daily-report-bot'
          commit_user_email: 'noreply@github.com'
          # repo 안의 변경된 state.db 만 커밋. 다른 변경 무시.
          add_options: '-u'
